appId: com.osmaref.referee
productName: osmaRef
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: ../../assets/HarmonyOS_Sans/LICENSE.txt
    to: licenses/HarmonyOS_Sans_LICENSE.txt
  - from: ../../LICENSE
    to: licenses/osmaRef_LICENSE.txt
win:
  icon: build/icon.ico
  target:
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false